<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vinzap Auto-Poster Status</title>
<style>:root{--bg:#0f1220;--card:#1a1f36;--tx:#eef;--mut:#99a;--ac:#ffd23f;--ok:#3ddc84;--bad:#ff5c5c}
body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx)}main{max-width:760px;margin:auto;padding:16px}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px}.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:#2a3050;margin:2px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--mut);font-size:13px}pre{white-space:pre-wrap;font-size:12px;color:var(--mut)}
input{width:100%;padding:8px;border-radius:8px;border:1px solid #333a5c;background:#0f1220;color:var(--tx);margin:6px 0}
button{background:var(--ac);border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer}</style></head><body><main>
<h2>🎬 Vinzap Auto-Poster</h2><div id="o"></div>
<script>
const R="vizz-bob/vinzap-social-agent",$=s=>document.querySelector(s);let T="";try{T=localStorage.getItem("gt")||""}catch(e){}
const H=()=>({Authorization:"Bearer "+T,Accept:"application/vnd.github+json"});
const ago=t=>{let m=Math.round((Date.now()/1000-t)/60);return m<60?m+" min ago":Math.round(m/60)+" h ago"};
async function load(){
 if(!T){$("#o").innerHTML=`<div class="card"><b>Paste your GitHub token once</b><div class="mut">Fine-grained token for ${R} with Contents: Read and Actions: Read and write. Saved only in this browser.</div><input id="t" type="password" placeholder="github_pat_..."><button onclick="st()">Save</button></div>`;return}
 try{
 let q=await (await fetch(`https://api.github.com/repos/${R}/contents/state/queue.json`,{headers:{...H(),Accept:"application/vnd.github.raw"}})).json();
 let runs=(await (await fetch(`https://api.github.com/repos/${R}/actions/runs?per_page=8`,{headers:H()})).json()).workflow_runs||[];
 let t0=new Date();t0.setHours(0,0,0,0);t0=t0/1000,today={},fails=0;
 q.items.forEach(i=>Object.entries(i.posted).forEach(([k,v])=>{if(v.ts>=t0){if(v.ok)today[k]=(today[k]||0)+1;else fails++}}));
 $("#o").innerHTML=`<div class="card">${Object.entries(today).map(([k,v])=>`<span class="pill ok">${k}: ${v} today</span>`).join("")||"<span class=mut>no posts yet today</span>"}
 <div style="margin-top:8px">Last post: <b>${q.last_post?ago(q.last_post):"-"}</b> · Failures today: <b class="${fails?"bad":"ok"}">${fails}</b></div><br>
 <button onclick="run()">Trigger a run now</button> <button onclick="load()">Refresh</button> <button onclick="lo()" style="background:#2a3050;color:#eef">Forget token</button></div>
 <div class="card"><b>Recent runs</b><div>${runs.map(r=>`<span class="pill ${r.conclusion=="success"?"ok":r.conclusion=="failure"?"bad":""}">${r.event} · ${r.conclusion||r.status} · ${new Date(r.created_at).toLocaleTimeString()}</span>`).join("")}</div></div>
 <div class="card"><b>Latest posts</b>${q.items.slice(-10).reverse().map(i=>`<div style="margin:6px 0">${i.title} <span class="pill">${i.kind}</span>${Object.entries(i.posted).map(([k,v])=>`<span class="pill ${v.ok?"ok":"bad"}">${k}</span>`).join("")}</div>`).join("")}</div>
 <div class="card"><b>Log</b><pre>${q.log.slice(-20).reverse().join("\n")}</pre></div>`;
 }catch(e){$("#o").innerHTML=`<div class="card bad">Could not load (${e}). Check the token.</div><button onclick="lo()">Reset token</button>`}}
function st(){T=$("#t").value.trim();try{localStorage.setItem("gt",T)}catch(e){}load()}
function lo(){T="";try{localStorage.removeItem("gt")}catch(e){}load()}
async function run(){let r=await fetch(`https://api.github.com/repos/${R}/actions/workflows/post.yml/dispatches`,{method:"POST",headers:H(),body:JSON.stringify({ref:"main"})});alert(r.status==204?"Run started. Refresh in a minute.":"Failed: "+r.status+" (token needs Actions: Read and write)")}
load();
</script></main></body></html>
