name: Post to social media
on:
  schedule:
    - cron: "*/15 6-17 * * *"
  workflow_dispatch: {}          # lets you press "Run workflow" by hand
permissions:
  contents: write
concurrency:
  group: social-agent
  cancel-in-progress: false
env:
  TZ: Asia/Kolkata
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Write config from secret
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: printf '%s' "$CONFIG_JSON" > config.json
      - name: Is a post due?
        id: gate
        run: python3 due_check.py
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.due == 'true'
        with:
          python-version: "3.12"
      - name: Install tools
        if: steps.gate.outputs.due == 'true'
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg
          pip install --quiet pillow numpy
      - name: Make and post one item
        if: steps.gate.outputs.due == 'true'
        timeout-minutes: 10
        run: python3 run_once.py
      - name: Save state
        if: always()
        run: |
          rm -f config.json
          git config user.name "social-agent"; git config user.email "social-agent@users.noreply.github.com"
          git add state/queue.json
          if ! git diff --cached --quiet; then
            git commit -m "state $(date -u +%FT%TZ)"
            for i in 1 2 3 4; do
              if git pull --rebase -X theirs -q && git push; then break; fi
              git rebase --abort 2>/dev/null || true
              sleep 4
            done
          fi
